{% extends "base.html" %} {% block title %}회원가입 | 투두리스트{% endblock %}
{% block contents %}
<div class="mx-auto max-w-md">
  <div class="mb-8">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-indigo-600">
      Sign Up
    </p>
    <h2 class="mt-2 text-3xl font-bold text-slate-900">회원가입</h2>
    <p class="mt-2 text-sm text-slate-500">
      새 계정을 만들고 투두리스트를 시작해보세요.
    </p>
  </div>

  <form class="space-y-5">
    <div>
      <label for="name" class="mb-2 block text-sm font-medium text-slate-700"
        >이름</label
      >
      <input
        id="name"
        type="text"
        placeholder="홍길동"
        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"
      />
    </div>

    <div>
      <label for="email" class="mb-2 block text-sm font-medium text-slate-700"
        >이메일</label
      >
      <input
        id="email"
        type="email"
        placeholder="example@email.com"
        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"
      />
    </div>

    <div>
      <label
        for="password"
        class="mb-2 block text-sm font-medium text-slate-700"
        >비밀번호</label
      >
      <input
        id="password"
        type="password"
        placeholder="8자 이상 입력하세요"
        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"
      />
    </div>

    <div>
      <label
        for="confirm-password"
        class="mb-2 block text-sm font-medium text-slate-700"
        >비밀번호 확인</label
      >
      <input
        id="confirm-password"
        type="password"
        placeholder="비밀번호를 다시 입력하세요"
        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"
      />
    </div>

    <button
      type="submit"
      class="w-full rounded-2xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700"
    >
      회원가입
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-500">
    이미 계정이 있나요?
    <a href="/login" class="font-semibold text-indigo-600 hover:text-indigo-700"
      >로그인</a
    >
  </p>
</div>
{% endblock %}
